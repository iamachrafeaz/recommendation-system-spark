version: '3.8'

services:
  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "UHtBHe7pRe2vr50e9Afe2g"   # ← remplacez par votre UUID
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  spark-batch:
    build: ./spark
    container_name: spark-batch
    volumes:
      - spark-models:/app/output   # ← volume nommé, plus fiable que bind mount
    command: >
      spark-submit --master local[*]
      /app/batch.py
      --input /app/reviews_90.csv
      --output-dir /app/output

  spark-streaming:
    build: ./spark
    container_name: spark-streaming
    depends_on:
      broker:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-batch:
        condition: service_completed_successfully
    volumes:
      - spark-models:/app/output
    environment:
      - REDIS_HOST=redis
    command: >
      spark-submit --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /app/streaming.py

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      broker:
        condition: service_healthy
      spark-batch:
        condition: service_completed_successfully
    command: python producer.py

  flask-api:
    build: ./dashboard
    container_name: flask-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    command: python app.py

  streamlit-ui:
    build: ./dashboard
    container_name: streamlit-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://flask-api:8000
    depends_on:
      - flask-api
    command: streamlit run dashboard_ui.py --server.port=8501 --server.address=0.0.0.0

volumes:
  spark-models:   # ← volume nommé partagé entre batch et streaming