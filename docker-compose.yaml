services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata-net

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    hostname: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bigdata-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bigdata-net

  spark-master:
    build: ./spark
    image: recsys-spark:latest
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -lc "/opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/*"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/app
      - spark-models:/app/output
    networks:
      - bigdata-net

  spark-worker:
    image: recsys-spark:latest
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      bash -lc "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /opt/spark/logs/*"
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/app
      - spark-models:/app/output
    networks:
      - bigdata-net

  producer:
    build: ./producer
    image: recsys-producer:latest
    container_name: producer
    depends_on:
      - broker
    volumes:
      - ./producer:/app
    command: ["python", "producer.py"]
    networks:
      - bigdata-net

  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-net

  airflow-init:
    build: ./airflow
    image: recsys-airflow:latest
    container_name: airflow-init
    depends_on:
      - postgres
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      --password admin || true
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata-net

  airflow-webserver:
    image: recsys-airflow:latest
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    environment: *airflow-env
    command: webserver
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata-net

  airflow-scheduler:
    image: recsys-airflow:latest
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata-net

  dashboard-api:
    image: python:3.10-slim
    container_name: dashboard-api
    working_dir: /app
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_PORT: "8000"
    volumes:
      - ./dashboard:/app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      python app.py"
    ports:
      - "8000:8000"
    networks:
      - bigdata-net

  dashboard-ui:
    image: python:3.10-slim
    container_name: dashboard-ui
    working_dir: /app
    depends_on:
      - dashboard-api
    environment:
      API_BASE_URL: http://dashboard-api:8000
    volumes:
      - ./dashboard:/app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      streamlit run dashboard_ui.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    networks:
      - bigdata-net

volumes:
  redis-data:
  postgres-data:
  spark-models:

networks:
  bigdata-net:
    name: bigdata-net
